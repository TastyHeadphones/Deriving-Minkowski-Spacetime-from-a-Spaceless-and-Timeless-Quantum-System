name: Verify and publish research
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    uses: ./.github/workflows/lean-verification.yml
  audit:
    needs: lean
    uses: ./.github/workflows/axiom-audit.yml
  science:
    uses: ./.github/workflows/scientific-tests.yml
  reproduce:
    needs: [audit, science]
    uses: ./.github/workflows/reproducibility.yml
  site:
    needs: [lean, audit, science, reproduce]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: science
          path: artifacts/science
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lean-audit
          path: artifacts/proof
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reproducibility
          path: artifacts/reproducibility
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install document renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-latex-base texlive-latex-extra lmodern
      - name: Build and check the website
        run: |
          node --test tests/website.test.mjs
          python3 scripts/build_site.py --require-verification --pdf
        env:
          RESEARCH_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RESEARCH_CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
  deploy:
    needs: site
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified static files
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
