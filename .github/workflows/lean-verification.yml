name: Lean build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
      - shell: bash
        run: |
          mkdir -p artifacts/build
          lake build | tee artifacts/build/lake-build.log
          lake env lean --version | tee artifacts/build/lean-version.txt
          git rev-parse HEAD > artifacts/build/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-build
          path: artifacts/build
          if-no-files-found: error
